name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default: the build job only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found - using npm ci for a reproducible install."
            npm ci --no-audit --no-fund
          else
            echo "No package-lock.json - falling back to npm install."
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build

      - name: Verify build output
        run: npm run verify

  # Production deploy. Runs ONLY after the build job succeeds, and ONLY for
  # main (never for pull requests). This is the single source of truth for
  # deploys - there is no separate deploy workflow.
  #
  # Requires ONE repository secret (Settings -> Secrets and variables -> Actions):
  #   VERCEL_TOKEN      - a Vercel access token (https://vercel.com/account/tokens)
  # Optional (needed for the prebuilt flow / team scope):
  #   VERCEL_ORG_ID     - team/org id, passed to the CLI as `--scope`
  #   VERCEL_PROJECT_ID - project id
  #
  # The project name is pinned to `apexaudit-ai`, so the production URL is
  # https://apexaudit-ai.vercel.app. Vercel builds with the settings in
  # vercel.json (framework: vite, buildCommand: npm run build,
  # outputDirectory: dist) and deploys api/audit.js as a serverless function.
  #
  # Until VERCEL_TOKEN is set, the job skips cleanly (it does NOT fail CI).
  deploy:
    name: Deploy to Vercel (production)
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Consumed by the `smoke` job: `ready` says whether a token was visible
    # (i.e. whether a deploy was attempted), `url` is the deployment URL.
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      url: ${{ steps.deploy.outputs.url }}
    # The failure-diagnostics step commits a status file back to the repo.
    permissions:
      contents: write
    # The token may be supplied as a repository SECRET or a repository VARIABLE.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check for Vercel credentials
        id: check
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Vercel token found::A Vercel token is visible to this job; deploying."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Vercel deploy skipped::No VERCEL_TOKEN is visible to this workflow. Add it as a REPOSITORY secret (Settings -> Secrets and variables -> Actions -> Secrets) named exactly VERCEL_TOKEN. A repository VARIABLE of the same name is also accepted. Environment secrets only work for the environment the job declares (this job declares none)."
          fi

      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        if: steps.check.outputs.ready == 'true'
        run: npm install --global vercel@latest

      # Non-fatal: if the token is rejected we want the DEPLOY step to run
      # anyway so the real CLI error is captured (and published) instead of a
      # bare `vercel whoami` failure that leaves no diagnostics behind.
      - name: Verify token (non-fatal)
        if: steps.check.outputs.ready == 'true'
        run: |
          set -uo pipefail
          code=0
          out="$(vercel whoami --token="$VERCEL_TOKEN" 2>&1)" || code=$?
          {
            echo "vercel whoami (exit $code)"
            printf '%s\n' "$out"
            echo "---"
          } > /tmp/vercel-deploy.log
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Vercel token rejected by CLI::'vercel whoami' exited $code. The deploy step still runs; if it fails, the full CLI output is published to .deploy-status.json."
          fi

      - name: Deploy to production
        if: steps.check.outputs.ready == 'true'
        id: deploy
        run: |
          set -uo pipefail
          SCOPE_ARGS=()
          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            SCOPE_ARGS+=(--scope "$VERCEL_ORG_ID")
          fi

          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Prebuilt flow: VERCEL_ORG_ID + VERCEL_PROJECT_ID are set."
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN" "${SCOPE_ARGS[@]}"
            vercel build --prod --token="$VERCEL_TOKEN" "${SCOPE_ARGS[@]}"
            set +e
            url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" "${SCOPE_ARGS[@]}" 2>&1)"
            code=$?
            set -e
          else
            echo "VERCEL_ORG_ID/VERCEL_PROJECT_ID not set - using the remote build pinned to project 'apexaudit-ai'."
            set +e
            url="$(vercel deploy --prod --yes --project apexaudit-ai --token="$VERCEL_TOKEN" "${SCOPE_ARGS[@]}" 2>&1)"
            code=$?
            set -e
          fi

          printf '%s\n' "$url" > /tmp/vercel-deploy.log
          if [ "$code" -ne 0 ]; then
            echo "::error title=Vercel deploy failed::exit $code"
            printf '%s\n' "$url" | tail -40
            exit "$code"
          fi
          # The CLI prints progress plus the final URL; keep only the last
          # https:// line so the job output is a single clean value.
          deploy_url="$(printf '%s\n' "$url" | grep -oE 'https://[^[:space:]]+' | tail -1 || true)"
          echo "url=$deploy_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to production :rocket:"
            echo ""
            echo "$deploy_url"
          } >> "$GITHUB_STEP_SUMMARY"

      # On failure, publish the CLI output back to the repo so the run can be
      # diagnosed without dashboard access to the Actions logs.
      - name: Publish failure status
        if: failure() && steps.check.outputs.ready == 'true'
        run: |
          set -uo pipefail
          python3 - <<'PY' > .deploy-status.json
          import json, os
          try:
              out = open('/tmp/vercel-deploy.log').read()[-3000:]
          except Exception:
              out = 'no log captured'
          print(json.dumps({
              "status": "failed",
              "run": os.environ.get("RUN_URL", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "also_present": {
                  "VERCEL_ORG_ID": bool(os.environ.get("VERCEL_ORG_ID", "")),
                  "VERCEL_PROJECT_ID": bool(os.environ.get("VERCEL_PROJECT_ID", "")),
              },
              "output": out,
          }, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status.json
          git commit -m "chore: record failed Vercel deploy [skip ci]" || true
          git push || true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Post-deploy smoke test. Runs ONLY after the deploy job succeeds. Curls the
  # key production routes and FAILS the job on any non-200 response, retrying
  # with a short backoff to allow for Vercel propagation delay. When the deploy
  # was skipped because no Vercel token was visible, this job warns and exits
  # cleanly - it never fails CI for a deployment that did not happen.
  smoke:
    name: Smoke test (production)
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check whether a deploy happened
        id: gate
        env:
          READY: ${{ needs.deploy.outputs.ready }}
        run: |
          if [ "${READY:-}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Smoke test skipped::The deploy job did not deploy (no Vercel token was visible), so there is nothing to smoke-test."
          fi

      - name: Smoke test production routes
        if: steps.gate.outputs.run == 'true'
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
        run: |
          set -uo pipefail

          # Prefer the URL the deploy step captured; fall back to the pinned
          # production domain. Normalise to a bare origin.
          BASE="$(printf '%s\n' "${DEPLOY_URL:-}" | grep -oE 'https://[^[:space:]]+' | tail -1 || true)"
          case "$BASE" in
            http*) ;;
            *) BASE="https://apexaudit-ai.vercel.app" ;;
          esac
          BASE="${BASE%/}"
          echo "Smoke-testing $BASE"

          ROUTES=(
            "/"
            "/app"
            "/history"
            "/compare"
            "/compare/ahrefs"
            "/api/audit?url=https://example.com"
          )

          fail=0
          for route in "${ROUTES[@]}"; do
            url="$BASE$route"
            code=""
            for attempt in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$url" || echo 000)"
              if [ "$code" = "200" ]; then
                break
              fi
              echo "  attempt $attempt: $url -> $code (retrying in 5s)"
              sleep 5
            done
            if [ "$code" = "200" ]; then
              echo "OK   $code  $url"
            else
              echo "FAIL $code  $url"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error title=Smoke test failed::One or more production routes did not return HTTP 200."
            exit 1
          fi
          echo "All production routes returned HTTP 200."
