name: Sync lockfile

# Keeps package-lock.json in the repo so CI can install with `npm ci`
# (reproducible, pinned dependency tree). Runs on every push to main and
# commits the lockfile only when it actually changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit lockfile if changed
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock.json for reproducible builds"
          git push
