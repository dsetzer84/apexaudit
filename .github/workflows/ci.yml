name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] && npm ci --no-audit --no-fund; then
            echo "Installed reproducibly from package-lock.json."
          else
            echo "Lockfile missing or out of sync - falling back to npm install."
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build
