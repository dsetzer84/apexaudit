name: Deploy to Vercel

# Deploys the ApexAudit Vite build to Vercel production on every push to main.
#
# Requires ONE repository secret (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN   - a Vercel access token (https://vercel.com/account/tokens)
#
# Optional (only needed when the project lives in a team scope):
#   VERCEL_ORG_ID  - the team/org id, passed to the CLI as `--scope`
#
# The project name is pinned to `apexaudit-ai`, so the production URL is
# https://apexaudit-ai.vercel.app. Vercel builds the project remotely using the
# settings in vercel.json (framework: vite, buildCommand: npm run build,
# outputDirectory: dist) and deploys api/audit.js as a serverless function.
#
# Until VERCEL_TOKEN is set, the job skips cleanly (it does NOT fail CI).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Check for Vercel credentials
        id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Vercel deploy skipped::VERCEL_TOKEN secret is not set. Add it under Settings -> Secrets and variables -> Actions to enable automatic deploys."
          fi

      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        if: steps.check.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Deploy to production
        if: steps.check.outputs.ready == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -uo pipefail
          SCOPE_ARGS=()
          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            SCOPE_ARGS+=(--scope "$VERCEL_ORG_ID")
          fi
          set +e
          url="$(vercel deploy --prod --yes --project apexaudit-ai "${SCOPE_ARGS[@]}" --token="$VERCEL_TOKEN" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$url" > /tmp/vercel-deploy.log
          if [ "$code" -ne 0 ]; then
            echo "::error title=Vercel deploy failed::exit $code"
            printf '%s\n' "$url" | tail -40
            exit "$code"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to production :rocket:"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      # On failure, publish the CLI output back to the repo so the run can be
      # diagnosed without dashboard access to the Actions logs.
      - name: Publish failure status
        if: failure() && steps.check.outputs.ready == 'true'
        run: |
          set -uo pipefail
          python3 - <<'PY' > .deploy-status.json
          import json, os
          try:
              out = open('/tmp/vercel-deploy.log').read()[-3000:]
          except Exception:
              out = 'no log captured'
          print(json.dumps({
              "status": "failed",
              "run": os.environ.get("RUN_URL", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "output": out,
          }, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status.json
          git commit -m "chore: record failed Vercel deploy [skip ci]" || true
          git push || true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
