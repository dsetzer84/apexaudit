name: Deploy to Vercel

# Deploys the ApexAudit Vite build to Vercel production on every push to main.
#
# The token may be supplied EITHER as a repository secret or as a repository
# variable (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN   - a Vercel access token (https://vercel.com/account/tokens)
#   VERCEL_ORG_ID  - optional; only needed when the project lives in a team scope
#
# The project name is pinned to `apexaudit-ai`, so the production URL is
# https://apexaudit-ai.vercel.app. Vercel builds the project remotely using the
# settings in vercel.json (framework: vite, buildCommand: npm run build,
# outputDirectory: dist) and deploys api/audit.js as a serverless function.
#
# Until a token is visible to the job, it skips cleanly (it does NOT fail CI)
# and emits a warning annotation explaining exactly what to check.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    # Declaring an environment makes environment-scoped secrets visible too.
    # Repo-level secrets/variables remain available either way.
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
    steps:
      - name: Check for Vercel credentials
        id: check
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Vercel token found::A Vercel token is visible to this job; deploying."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Vercel deploy skipped::No VERCEL_TOKEN is visible to this workflow. Add it as a REPOSITORY secret (Settings -> Secrets and variables -> Actions -> Secrets) named exactly VERCEL_TOKEN. A repository VARIABLE of the same name is also accepted. Environment secrets only work for the environment the job declares (this job declares 'production')."
          fi

      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        if: steps.check.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Verify token
        if: steps.check.outputs.ready == 'true'
        run: vercel whoami --token="$VERCEL_TOKEN"

      - name: Deploy to production
        if: steps.check.outputs.ready == 'true'
        id: deploy
        run: |
          set -uo pipefail
          SCOPE_ARGS=()
          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            SCOPE_ARGS+=(--scope "$VERCEL_ORG_ID")
          fi
          set +e
          url="$(vercel deploy --prod --yes --project apexaudit-ai "${SCOPE_ARGS[@]}" --token="$VERCEL_TOKEN" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$url" > /tmp/vercel-deploy.log
          if [ "$code" -ne 0 ]; then
            echo "::error title=Vercel deploy failed::exit $code"
            printf '%s\n' "$url" | tail -40
            exit "$code"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to production :rocket:"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      # On failure, publish the CLI output back to the repo so the run can be
      # diagnosed without dashboard access to the Actions logs.
      - name: Publish failure status
        if: failure() && steps.check.outputs.ready == 'true'
        run: |
          set -uo pipefail
          python3 - <<'PY' > .deploy-status.json
          import json, os
          try:
              out = open('/tmp/vercel-deploy.log').read()[-3000:]
          except Exception:
              out = 'no log captured'
          print(json.dumps({
              "status": "failed",
              "run": os.environ.get("RUN_URL", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "output": out,
          }, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status.json
          git commit -m "chore: record failed Vercel deploy [skip ci]" || true
          git push || true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
