<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page not found | ApexAudit AI</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #09090b; color: #f4f4f5;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      max-width: 460px; padding: 40px 36px; text-align: center; border-radius: 18px;
      background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.3);
    }
    .code { font-size: 64px; font-weight: 800; letter-spacing: -2px; color: #10b981; line-height: 1; }
    h1 { font-size: 20px; margin: 18px 0 8px; }
    p { color: #a1a1aa; font-size: 14px; line-height: 1.6; margin: 0 0 26px; }
    a {
      display: inline-block; padding: 11px 22px; border-radius: 10px;
      background: #10b981; color: #052e21; font-weight: 600; font-size: 14px;
      text-decoration: none; transition: background 0.2s;
    }
    a:hover { background: #059669; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>This page could not be found</h1>
    <p>The URL you requested is not part of ApexAudit AI. Head back to the audit dashboard and scan a site instead.</p>
    <a href="/">Back to ApexAudit AI</a>
  </div>
</body>
</html>
